---
client:
  client_type: openai
    # auth key is supplied by HERACLES_OPENAI_API_KEY
  timeout: 20
model_info:
  model: gpt-4.1
  temperature: 0.2
  seed: 123
agent_info:
  prompt_settings:
    base_prompt: agent_prompt.yaml
  tools:
    - name: run_cypher_query
      bound_args:
        dsgdb_conf:
          dsg_interface_type: heracles
          uri: neo4j://$ADT4_HERACLES_IP:7683
    # robot_name and planner_topic are intentionally left unbound: bound_args are
    # not env-expanded, so pinning them here ties this config to one robot. Left
    # out, the tool derives them from ADT4_EXECUTOR_ROBOT_NAME / ADT4_ROBOT_NAME,
    # matching whatever run-adt4 session is running. Bind them to override.
    - name: send_pddl_goal_with_constraints
  tool_interface: openai
  max_iterations: 6
